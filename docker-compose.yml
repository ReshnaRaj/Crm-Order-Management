# Local development database only (not a deployment definition).
services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-crm-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: mini_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d mini_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
